name: Build APK LOGIEZE Movil

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v4

    - name: Dependencias del sistema (antes de tocar python3)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          python3-pip build-essential git zip unzip \
          openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev

    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fijar python3 al 3.11 instalado
      run: |
        PYPATH=$(which python3)
        echo "Usando: $PYPATH = $(python3 --version)"
        sudo update-alternatives --install /usr/bin/python3 python3 "$PYPATH" 100
        sudo update-alternatives --set python3 "$PYPATH"
        echo "Verificacion: $(python3 --version)"

    - name: Cache buildozer (Android SDK/NDK)
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('app_movil/buildozer.spec') }}
        restore-keys: buildozer-${{ runner.os }}-

    - name: Aceptar licencias Android SDK
      run: |
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

    - name: Instalar buildozer y cython
      run: pip install buildozer==1.5.0 cython==0.29.33

    - name: Compilar APK
      working-directory: app_movil
      run: yes | buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: logieze-movil-debug
        path: app_movil/bin/*.apk
        retention-days: 30
