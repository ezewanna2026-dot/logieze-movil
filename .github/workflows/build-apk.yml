name: Build APK LOGIEZE Movil

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v4

    - name: Cache buildozer (Android SDK/NDK)
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-docker-${{ runner.os }}-v8-${{ hashFiles('app_movil/buildozer.spec') }}
        restore-keys: buildozer-docker-${{ runner.os }}-v8-

    - name: Compilar APK (Docker kivy/buildozer)
      run: |
        mkdir -p ~/.buildozer
        docker run --rm \
          --entrypoint /bin/bash \
          -v "${{ github.workspace }}:/home/user/hostcwd" \
          -v "$HOME/.buildozer:/home/user/.buildozer" \
          kivy/buildozer:latest \
          -c "
            python3 - <<'PYEOF'
        import pythonforandroid, os, re
        recipe = os.path.join(os.path.dirname(pythonforandroid.__file__), 'recipes', 'hostpython3', '__init__.py')
        print('Patching:', recipe)
        with open(recipe) as f:
            content = f.read()
        hits = re.findall(r\"version\\s*=\\s*'3\\.[^']*'\", content)
        print('Version patterns:', hits[:5])
        content2 = re.sub(r\"version\\s*=\\s*'3\\.[0-9][^']*'\", \"version = '3.11.9'\", content, count=1)
        with open(recipe, 'w') as f:
            f.write(content2)
        print('Patched hostpython3 to Python 3.11.9')
        PYEOF
            cd /home/user/hostcwd/app_movil && yes | buildozer -v android debug
          "
        sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/app_movil/" 2>/dev/null || true

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: logieze-movil-debug
        path: app_movil/bin/*.apk
        retention-days: 30
